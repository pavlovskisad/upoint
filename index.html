  }
  if(depth <= 0 || b.y > H+130) return;
  const k = (b.y > H*0.95 || Math.random()>0.72) ? 1 : 2;
  for(let j=0;j<k;j++){
    const sd = k===2 ? (j===0?-1:1) : (Math.random()>0.5?1:-1);
    const a = ang + sd*(16+Math.random()*28)*Math.PI/180;
    // gravity, plus the outward lean the steep first step deferred
    let vx=Math.cos(a) + lat*0.34, vy=Math.sin(a)+0.30;
    rootStep(b, Math.atan2(vy,vx), len*rnd(0.62,0.86), w1, depth-1,
             delay+240+Math.random()*170, LW, lat*0.66);
  }
}
function growRoots(){
  if(roots.length || !logo.scale) return;
  const lp = logoScreenPts(), LW = logo.scale*WRATIO;
  const n = 6 + ((Math.random()*3)|0);
  for(let i=0;i<n;i++){
    const u = clamp(0.06 + (i/(n-1))*0.88 + rnd(-0.05,0.05), 0.03, 0.97);
    const q = lp[Math.round(u*(lp.length-1))];
    // Start on the spine and run thick. The mark is drawn over the top of
    // everything, so the whole start of a root is hidden inside the stroke and
    // what shows is only where it leaves the mark's lower edge — already at
    // width, tapering downward, which is what makes it read as growing out.
    const p = q;
    const lat = (u-0.5)*2;
    const taproot = Math.abs(lat) < 0.34;
    // Fan from the start, wider than the mark: a root system that leaves
    // straight down bundles into a narrow onion under the trunk and stops
    // reading as something the mark spreads into.
    const ang = Math.atan2(1, lat*rnd(0.70,1.45));
    rootStep(p, ang, taproot ? H*rnd(0.10,0.15) : H*rnd(0.055,0.10),
             LW*rnd(0.66,0.88), 3, i*80 + rnd(0,110), LW, lat);
  }
}

function mkNode(x,y,parent){ return {x,y,parent,seg:null}; }
function limb(a,b,bend,n=64){
  const dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy)||1, nx=-dy/L, ny=dx/L, p=[];
  for(let i=0;i<=n;i++){const t=i/n, o=Math.sin(t*Math.PI)*bend;
    p.push({x:a.x+dx*t+nx*o, y:a.y+dy*t+ny*o});}
  return p;
}
function mkSeg(a,b,w0,w1,bend){
  const pts = limb(a,b,bend);
  const s = {a,b,pts,w0,w1,prog:0,drawn:false,used:[],p2d:null,
             len:Math.hypot(b.x-a.x,b.y-a.y)};
  b.seg = s; return s;
}

function growTree(){
  twigs = [];
  const baseY = H - Math.max(96, H*0.125) - SAB*0.7 - 4;
  const lean = rnd(-1,1);
  const base = mkNode(cx + lean*W*0.03, baseY, null);
  const J1   = mkNode(base.x + rnd(-1,1)*W*0.05, H*0.70 + rnd(-16,16), base);
  const J2   = mkNode(J1.x + rnd(-1,1)*W*0.06,  H*0.47 + rnd(-18,18), J1);

  // Six tips, and which side each one lives on is fixed rather than random:
  // the swipe that reaches a word has to mean the same thing on every visit.
  // Only the jitter moves. Laid out so the four original words keep their
  // cardinal swipes and the two newer ones take the diagonals.
  const comm  = mkNode(clamp(cx + rnd(W*0.10,W*0.20), W*0.52, W*0.78),
                       H*0.635 + rnd(-18,18), J1);
  const spot  = mkNode(clamp(cx - rnd(W*0.10,W*0.20), W*0.20, W*0.46),
                       H*0.665 + rnd(-18,18), J1);
  const left  = mkNode(clamp(W*0.19 + rnd(-14,14), M+8, W*0.30),
                       H*0.42 + rnd(-26,26), J2);
  const right = mkNode(clamp(W*0.83 + rnd(-12,12), W*0.78, W-M-8),
                       H*0.42 + rnd(-26,26), J2);
  const cal   = mkNode(clamp(W*0.76 + rnd(-16,16), W*0.62, W-M-8),
                       Math.max(H*0.265 + rnd(-18,18), 190), J2);
  const crown = mkNode(clamp(cx + rnd(-1,1)*W*0.09, W*0.32, W*0.68),
                       Math.max(H*0.175 + rnd(-14,14), 138), J2);

  const bd = L => L * rnd(0.05,0.13) * (Math.random()>0.5?1:-1);
  const segs = [
    mkSeg(base,J1, SW*1.08, SW*0.88, bd(J1.y-base.y)),
    mkSeg(J1,J2,   SW*0.86, SW*0.70, bd(J2.y-J1.y)),
    mkSeg(J1,comm, SW*0.66, SW*0.40, bd(140)),
    mkSeg(J1,spot, SW*0.62, SW*0.38, bd(140)*-1),
    mkSeg(J2,left, SW*0.66, SW*0.38, bd(160)),
    mkSeg(J2,right,SW*0.66, SW*0.38, bd(160)),
    mkSeg(J2,cal,  SW*0.58, SW*0.34, bd(150)),
    mkSeg(J2,crown,SW*0.70, SW*0.36, bd(180))
  ];
  // One or two words per session sit ON their branch instead of clear of it,
  // so the limb grows straight through the label. All six would read as sloppy
  // placement; one or two reads as the tree taking the page over.
  const keys = ITEMS.map(it=>it.key), through = new Set();
  const nThrough = 1 + ((Math.random()*2)|0);
  while(through.size < nThrough) through.add(pick1(keys));
  TREE = {base, segs, through,
          tips:{market:left, insta:crown, lecture:right, channel:comm, spot, calendar:cal}};
}

/* rule 3-7: a twig leaving a branch it can never rejoin */
function sprout(seg){
  if(twigs.length > 44) return;
  let t = 0, tries = 0;
  do { t = rnd(0.35,0.92); tries++; }
  while(tries < 8 && seg.used.some(u => Math.abs(u-t) < 0.13));
  if(seg.used.some(u => Math.abs(u-t) < 0.13)) return;
  seg.used.push(t);

  const i = Math.floor(t*(seg.pts.length-1));
  const p = seg.pts[i], q = seg.pts[Math.min(i+4, seg.pts.length-1)];
  let vx = q.x-p.x, vy = q.y-p.y;
  const d = Math.hypot(vx,vy)||1; vx/=d; vy/=d;

  const side = Math.random()>0.5 ? 1 : -1;
  const a = (22 + Math.random()*22 + rnd(-8,8)) * Math.PI/180 * side;
  let nx = vx*Math.cos(a) - vy*Math.sin(a), ny = vx*Math.sin(a) + vy*Math.cos(a);
  ny -= 0.22; const nd = Math.hypot(nx,ny)||1; nx/=nd; ny/=nd;      // rule 6

  const L = clamp(seg.len*rnd(0.30,0.52), 34, 190);
  const b = {x: clamp(p.x+nx*L, M*0.5, W-M*0.5), y: clamp(p.y+ny*L, H*0.09, H-40)};
  const w = seg.w0 + (seg.w1-seg.w0)*t;
  twigs.push({pts:limb(p,b,L*rnd(0.08,0.20)*(-side),34),
              w0:Math.max(w*0.62, SW*0.16), w1:Math.max(w*0.20, SW*0.09),
              prog:0, t0:0, dur:RM?1:460, p2d:null});
}

/* ═══════════ tapered ink ═══════════ */
function smoothInto(p, A, start){
  const n = A.length;
  if(start) p.moveTo(A[0].x, A[0].y); else p.lineTo(A[0].x, A[0].y);
  for(let i=1;i<n-1;i++){
    const mx=(A[i].x+A[i+1].x)/2, my=(A[i].y+A[i+1].y)/2;
    p.quadraticCurveTo(A[i].x, A[i].y, mx, my);
  }
  if(n>1) p.quadraticCurveTo(A[n-2].x, A[n-2].y, A[n-1].x, A[n-1].y);
}
function ribbon(pts, w0, w1, upto){
  const total = pts.length-1;
  const n = upto===undefined ? pts.length : Math.max(2, Math.min(pts.length, upto));
  const L=[], Rr=[];
  for(let i=0;i<n;i++){
    const a=pts[Math.max(0,i-1)], b=pts[Math.min(total,i+1)];
    let dx=b.x-a.x, dy=b.y-a.y; const d=Math.hypot(dx,dy)||1; dx/=d; dy/=d;
    const hw=(w0+(w1-w0)*(i/total))/2;
    L.push({x:pts[i].x-dy*hw, y:pts[i].y+dx*hw});
    Rr.push({x:pts[i].x+dy*hw, y:pts[i].y-dx*hw});
  }
  const p = new Path2D();
  smoothInto(p, L, true);
  const back=[]; for(let i=n-1;i>=0;i--) back.push(Rr[i]);
  smoothInto(p, back, false);
  p.closePath();
  return {p, hw0:w0/2, hwE:(w0+(w1-w0)*((n-1)/total))/2, endPt:pts[n-1], startPt:pts[0]};
}
function inkStroke(o, w0, w1, color, prog){
  const full = prog===undefined || prog>=1;
  if(full && o.p2d){ ctx.fillStyle=color; ctx.fill(o.p2d); capDots(o, w0, w1, color, o.pts.length); return; }
  const upto = full ? undefined : Math.max(2, Math.floor(prog*(o.pts.length-1))+1);
  const r = ribbon(o.pts, w0, w1, upto);
  if(full) o.p2d = r.p;
  ctx.fillStyle = color; ctx.fill(r.p);
  ctx.beginPath(); ctx.arc(r.startPt.x, r.startPt.y, r.hw0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(r.endPt.x, r.endPt.y, r.hwE, 0, TAU); ctx.fill();
}
function bakeStroke(o, w0, w1, color){
  const r = ribbon(o.pts, w0, w1);
  sctx.fillStyle = color; sctx.fill(r.p);
  sctx.beginPath(); sctx.arc(r.startPt.x, r.startPt.y, r.hw0, 0, TAU); sctx.fill();
  sctx.beginPath(); sctx.arc(r.endPt.x, r.endPt.y, r.hwE, 0, TAU); sctx.fill();
  o.baked = true; o.p2d = null;
}
function capDots(o, w0, w1, color, n){
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(o.pts[0].x, o.pts[0].y, w0/2, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(o.pts[o.pts.length-1].x, o.pts[o.pts.length-1].y, w1/2, 0, TAU); ctx.fill();
}
function drawLogo(){
  ctx.save();
  if(logo.ink < 1) ctx.globalAlpha = fade * logo.ink;   // the first ink soaking in
  if(logo.prog < 1) clipPainted();
  ctx.translate(logo.ox, logo.oy); ctx.scale(logo.scale, logo.scale);
  ctx.fillStyle = BARK; ctx.fill(MARK_PATH);
  ctx.restore();
}
/* The reveal is the area a brush has actually swept: everything within a brush
   radius of the spine so far, then squared off across the stroke at the dot.
   It used to be a vertical curtain, which crosses the steep parts of the mark
   at a shallow angle and drops a whole section in at once, so ink showed up
   ahead of the dot. Both clips are needed — the discs alone bulge past the dot,
   the square cut alone reveals unrelated parts of the mark that happen to fall
   behind the same line. */
function clipPainted(){
  const S = logo.scale, n = LOGO_LOCAL.length;
  const px = k => logo.ox + LOGO_LOCAL[k].x*S, py = k => logo.oy + LOGO_LOCAL[k].y*S;
  // The reveal is the nib's sweep: discs along the spine, ending on the dot's
  // exact sub-sample position rather than the nearest sample. The leading disc
  // sits inside the dot, so the ink can never reach past it.
  // Wide behind, narrow at the nib. Discs well back use MARK_REACH so corners
  // come out in their true shape; the last few taper to MARK_HW so the leading
  // edge stays under the dot. The taper is short enough that a corner finishes
  // filling a few dozen px behind the brush, which reads as ink settling.
  const rFull = S*MARK_REACH*1.02, rTip = S*MARK_HW*1.03, K = 14;
  const rAt = back => back >= K ? rFull : rTip + (rFull-rTip)*(back/K);
  const f = clamp(logo.prog,0,1)*(n-1), i = Math.floor(f), fr = f-i;
  ctx.beginPath();
  // start behind the first point, so the round brush does not eat the angled
  // cut the mark really has at its left end
  const bx = px(0)-(px(1)-px(0))*8, by = py(0)-(py(1)-py(0))*8;
  const rb = rAt(i+8);
  ctx.moveTo(bx+rb, by); ctx.arc(bx, by, rb, 0, TAU);
  for(let k=0;k<=i;k++){ const rk = rAt(i-k);
    ctx.moveTo(px(k)+rk, py(k)); ctx.arc(px(k), py(k), rk, 0, TAU); }
  const j = Math.min(i+1, n-1);
  const lx = px(i)+(px(j)-px(i))*fr, ly = py(i)+(py(j)-py(i))*fr;
  ctx.moveTo(lx+rTip, ly); ctx.arc(lx, ly, rTip, 0, TAU);
  ctx.clip();
}

/* ═══════════ walking the tree (rule 8) ═══════════ */
function chainOf(n){ const c=[]; let k=n; while(k){ c.unshift(k); k=k.parent; } return c; }
function route(from, to){
  const A=chainOf(from), B=chainOf(to);
  let i=0; while(i<A.length && i<B.length && A[i]===B[i]) i++;
  const steps=[];
  for(let k=A.length-1;k>=i;k--) steps.push({seg:A[k].seg, rev:true});
  for(let k=i;k<B.length;k++)   steps.push({seg:B[k].seg, rev:false});
  return steps.filter(s => s.seg);
}
let atNode = null, picked = null;
function sproutOn(seg){ const before = twigs.length; sprout(seg); return twigs.length>before ? twigs[twigs.length-1] : null; }
function startTwig(t){ if(t) t.t0 = performance.now(); }

/* ═══════════ layout ═══════════ */
function layout(){
  DPR = Math.min(devicePixelRatio||1, 2);
  W = innerWidth; H = innerHeight;
  SAB = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sab')) || 0;
  cv.width = stat.width = W*DPR; cv.height = stat.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0); sctx.setTransform(DPR,0,0,DPR,0,0); sctx.clearRect(0,0,W,H);
  cx = W/2; cy = H*0.46; lastW=W; lastH=H;
  markW = Math.min(W*0.74, 360);
  SW = markW*WRATIO; R = SW/2; M = Math.max(22, W*0.07);
  if(phase === 'start'){ dot.x=cx; dot.y=cy; dot.r=R; dot.rT=R; logo.scale=markW; logo.ox=cx; logo.oy=cy; }
  placeAbout();
}
function footerPose(){
  // Big enough to read as the thing everything grew from. At 0.30 its stroke
  // was a quarter of the trunk's and the same weight as a root, so the mark
  // disappeared into its own root crown.
  const s = Math.min(markW*0.58, 210);
  return {scale:s, ox:cx, oy:H - Math.max(96, H*0.125) - SAB*0.7};
}

const aboutEl = document.getElementById('about');
function placeAbout(){
  aboutEl.style.left = (M + R*2 + 12)+'px';
  aboutEl.style.top  = Math.max(90, H*0.15)+'px';
  aboutEl.style.width = Math.min(W - M*2 - R*2 - 12, 520)+'px';
}
function fillAbout(){
  aboutEl.innerHTML='';
  COPY[lang].about.split(' ').forEach((w,i)=>{
    const s=document.createElement('span'); s.textContent=w;
    s.style.transitionDelay=(i*26)+'ms'; aboutEl.appendChild(s);
    // The space has to sit outside the span: each word is an inline-block, and
    // an inline-block drops its own trailing whitespace, so a space inside the
    // span renders as nothing and the paragraph runs together.
    aboutEl.appendChild(document.createTextNode(' '));
  });
}
function aboutOrigin(){
  const r=aboutEl.getBoundingClientRect();
  const lh=parseFloat(getComputedStyle(aboutEl).lineHeight)||30;
  return {x:r.left-R-4, y:r.top+lh*0.52};
}

/* ═══════════ menu ═══════════ */
const menuEl = document.getElementById('menu');
function buildMenu(){
  menuEl.innerHTML='';
  ITEMS.forEach(it=>{
    const e=document.createElement('div'); e.className='item '+it.side;
    e.innerHTML=`<div class="inner"><span class="w"></span><a class="u"></a></div>`;
    const u=e.querySelector('.u');
    // The panel item gets no href at all — an anchor navigates on click, and a
    // preventDefault on pointerdown would not stop it. role/tabindex put the
    // keyboard back.
    if(it.panel){
      u.setAttribute('role','button'); u.tabIndex=0;
      u.addEventListener('pointerdown',ev=>{ ev.stopPropagation(); openCal(); });
      u.addEventListener('keydown',ev=>{ if(ev.key==='Enter'||ev.key===' '){
        ev.preventDefault(); ev.stopPropagation(); openCal(); } });
    }
    else { u.href=LINKS[it.key]; u.target='_blank'; u.rel='noopener'; }
    e.querySelector('.inner').addEventListener('pointerdown',ev=>{ev.stopPropagation(); if(phase==='menu') go(it);});
    it.el=e; it.node=TREE.tips[it.key]; menuEl.appendChild(e);
  });
  paintText(); placeMenu();
}
function placeMenu(){
  if(!TREE) return;
  ITEMS.forEach(it=>{
    const e=it.el, n=TREE.tips[it.key]; if(!e) return;
    it.node = n;
    e.style.left=e.style.right='auto';
    // The label is only as wide as its word — the tag line is out of flow — so
    // it can sit on its tip instead of being shoved around to make room for
    // text that is not even visible until the word is picked.
    const w = e.offsetWidth, gap = SW*0.5 + 12;
    // the tag runs toward the middle of the screen, where there is always room
    const u = e.querySelector('.u');
    u.classList.remove('inL','inR'); u.classList.add(n.x < W/2 ? 'inL' : 'inR');
    let x, y = n.y-15;
    if(TREE.through && TREE.through.has(it.key)){
      x = clamp(n.x-w/2, M, Math.max(M, W-M-w));               // centred on the tip
    }
    else if(it.side==='left'  && n.x-gap-w >= M)   x = n.x-gap-w;   // beside, outboard
    else if(it.side==='right' && n.x+gap+w <= W-M) x = n.x+gap;
    else {
      // No room outboard — sit just above the tip rather than sliding in
      // against the trunk. Still reads as belonging to that branch.
      x = clamp(n.x-w/2, M, Math.max(M, W-M-w));
      y = Math.max(62, n.y-SW-40);
    }
    e.style.left = x+'px'; e.style.top = y+'px';
  });
}
function paintText(){
  ITEMS.forEach(it=>{ if(!it.el) return;
    it.el.querySelector('.w').textContent=it[lang];
    it.el.querySelector('.u').textContent=it.tag; });
  idxBtn.textContent=COPY[lang].idx;
  topBtn.title=COPY[lang].top; topBtn.setAttribute('aria-label',COPY[lang].top);
  const sh=document.getElementById('sheet'); sh.innerHTML='';
  if(INDEX_ON) ITEMS.forEach(it=>{ const a=document.createElement('a');
    if(it.panel){
      a.setAttribute('role','button'); a.tabIndex=0;
      a.addEventListener('click',ev=>{ ev.preventDefault(); closeSheet(); openCal(); });
      a.addEventListener('keydown',ev=>{ if(ev.key==='Enter'||ev.key===' '){
        ev.preventDefault(); ev.stopPropagation(); closeSheet(); openCal(); } });
    }
    else { a.href=LINKS[it.key]; a.target='_blank'; a.rel='noopener'; }
    a.innerHTML=`<span>${it[lang]}</span><em>${it.tag.split(' · ')[0]}</em>`; sh.appendChild(a); });
  fillCal();
  if(phase==='aboutDone'){ fillAbout(); aboutEl.classList.add('go'); aboutEl.style.opacity=1; }
  setHint();
}

/* ═══════════ the schedule ═══════════ */
const calEl = document.getElementById('cal');
// Dates are compared as plain ISO strings against today's local date, so an
// event stays listed for the whole of its own day and drops off after it.
function upcoming(){
  const t = new Date(), today =
    `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
  return EVENTS.filter(e => e.on >= today).sort((a,b) => a.on < b.on ? -1 : 1);
}
function fillCal(){
  const c = COPY[lang], list = upcoming();
  const fmt = iso => new Date(iso+'T00:00:00')
    .toLocaleDateString(lang==='ua'?'uk-UA':'en-GB', {day:'numeric', month:'short'});
  calEl.innerHTML = `<h3>${c.cal}</h3>` + (list.length
    ? '<ul>' + list.map(e =>
        `<li><b>${fmt(e.on)}${e.at?' · '+e.at:''}</b><span>${e[lang]||e.en}</span></li>`).join('') + '</ul>'
    : `<p>${c.calNone} <a href="${LINKS.channel}" target="_blank" rel="noopener">${c.calGo}</a></p>`);
}
function openCal(){ fillCal(); calEl.classList.add('open'); }
function closeCal(){ calEl.classList.remove('open'); }

/* ═══════════ phases ═══════════ */
let phase='start';
const hintEl=document.getElementById('hint'), topBtn=document.getElementById('top');
function setHint(){
  const c=COPY[lang], t={start:c.h0,logoDone:c.h1,aboutDone:c.h2,menu:c.h3}[phase];
  if(t){ hintEl.textContent=t; hintEl.classList.add('vis'); } else hintEl.classList.remove('vis');
  topBtn.classList.toggle('on', phase==='menu');   // only where there is no way out
}
const wait=(ms,f)=>setTimeout(f, RM?0:ms);

function goLogo(){
  busy=true; idle=false; hintEl.classList.remove('vis');
  // The pin snaps to yellow on the tap — snapped, not eased, because blue
  // easing to yellow passes through olive and reads as mud — and it *stays*
  // yellow: through a beat before it moves, and through the whole hop. The
  // morph to brown happens where it can be watched, with the dot sitting still
  // on the mark's left tip, and runs slower than the standard crossfade.
  dot.col = INK_RGB.slice(); dot.colT = INK_RGB; dot.gpsT = 0;
  const lp = LOGO_LOCAL.map(p=>({x:logo.ox+p.x*logo.scale, y:logo.oy+p.y*logo.scale}));
  wait(170, ()=>
  travel(arc(dot.x,dot.y,lp[0].x,lp[0].y,R*2.4,30),460,{end:()=>{
    dot.colK = 0.09; dot.colT = BARK_RGB;
    // Hold on landing. The mark's left end is a flat angled cut, and the whole
    // of it is inside the brush's first disc, so it used to appear the instant
    // the dot touched down — with the landing splat flattening the dot so it
    // could not even cover it. Let the splat settle on bare paper, then soak
    // the ink in as the brush starts to move.
    wait(330, ()=>{
      dot.colK = 0.14;
      logo.vis=true; logo.ink=0;
      tween(RM?1:280, p=>{ logo.ink = eOut(p); });
      travel(lp, RM?1:2100, {logo:true, end:()=>{
      const tip=lp[lp.length-1];
      dot.colT = INK_RGB;            // brown was the mark; off it, the dot is yellow
      travel(arc(tip.x,tip.y,tip.x-R*0.2,tip.y-R*2.6,R*3.4,26),430,{prep:100,end:()=>{
        dot.ringT=1;
        document.getElementById('tr').classList.add('vis','on');
        phase='logoDone'; busy=false; idle=true; nextIdle=performance.now()+500; setHint();
      }});
      }});
    });
  }}));
}
function goAbout(){
  busy=true; idle=false; hintEl.classList.remove('vis');
  const to=footerPose(), from={scale:logo.scale,ox:logo.ox,oy:logo.oy};
  fillAbout(); aboutEl.style.opacity=1;
  const o=aboutOrigin();
  // The dot squats, then launches up-left and the mark drops on the same frame,
  // so the leap reads as pushing the logo down rather than following it. Both
  // run the same length, so it is one gesture with two halves — the mark takes
  // the overshoot, which lands as the impact.
  const PREP = RM ? 0 : 130, FLIGHT = RM ? 1 : 760;
  wait(PREP, ()=>tween(FLIGHT, p=>{ const e=eBack(p);
    logo.scale=from.scale+(to.scale-from.scale)*e;
    logo.ox=from.ox+(to.ox-from.ox)*e; logo.oy=from.oy+(to.oy-from.oy)*e; }));
  // eOut, not the default eIO: a launch leaves fast and settles. With eIO the
  // dot crawls out of the squat while the mark's eBack drops hard, so the logo
  // reads as moving first even though both start on the same frame.
  travel(arc(dot.x,dot.y,o.x,o.y,Math.min(180,H*0.2),50),FLIGHT,{prep:PREP,ease:eOut,end:()=>{
    // it lands, then opens: the page is the dot at full size, and the copy is
    // knocked out of it in white
    flood.x=dot.x; flood.y=dot.y; dot.ringT=0;
    document.body.classList.add('flood');
    const RC = coverR(flood.x, flood.y);
    tween(600, p=>{ flood.r = RC*eOut(p); }, ()=>{
      aboutEl.classList.add('go');
      wait(900,()=>{ phase='aboutDone'; busy=false; idle=true; nextIdle=performance.now()+400; setHint(); });
    });
  }});
}
function goMenu(){
  busy=true; idle=false; hintEl.classList.remove('vis');
  growTree(); atNode = TREE.base;
  aboutEl.classList.add('out');                  // the copy flies off the top
  const r0 = flood.r;
  tween(540, p=>{ flood.r = r0*(1-eIO(p)); }, ()=>{
    flood.r = 0; document.body.classList.remove('flood');
    // still yellow: it stays the page's colour until it takes to the tree
    travel(arc(dot.x,dot.y,TREE.base.x,TREE.base.y,Math.min(230,H*0.26),60), RM?1:900,
      {prep: RM?0:120, end:()=>{
        buildMenu();
        ITEMS.forEach((it,i)=>wait(140+i*90,()=>it.el.classList.add('show')));
        phase='menu'; busy=false; idle=true; nextIdle=performance.now()+600; setHint();
      }});
  });
}
function go(it){
  if(busy || picked===it) return;
  busy=true; idle=false; hintEl.classList.remove('vis');
  if(picked) picked.el.classList.remove('pick');
  picked=it;
  if(!rootsGrown){ rootsGrown = true; growRoots(); }
  dot.colT = BARK_RGB;                           // on the tree it is the mark again
  const arrive = ()=>{
    atNode = it.node; it.el.classList.add('pick');
    busy=false; idle=true; nextIdle=performance.now()+400; setHint();
  };
  goJump(it, arrive);
}

/* The route still decides which branches exist — rule 1 holds, nothing joins
   two existing points — but the dot no longer traverses them. It flies to the
   tip while the branches draw themselves. */
function goJump(it, done){
  const g = gen;
  const steps = route(atNode, it.node);
  const fresh = steps.filter(s => !s.rev && !s.seg.drawn).map(s => s.seg);
  // Retraced segments used to sprout a twig ~55% of the time as the dot walked
  // back over them. Nothing retraces now, so sprout on the steps that would
  // have been retraced — without it the tree fills in visibly thinner.
  steps.filter(s => s.rev).forEach((_, i) => {
    if(Math.random() >= 0.55) return;
    setTimeout(()=>{ if(g!==gen || !TREE) return;
      const d = TREE.segs.filter(s=>s.drawn);
      if(d.length) startTwig(sproutOn(pick1(d))); }, RM?0:120 + i*160);
  });
  const now = performance.now();
  let start = now, last = now;
  for(const seg of fresh){
    seg.t0 = start;
    seg.dur = RM ? 1 : clamp(seg.len*1.5, 300, 760);
    seg.onDone = () => { if(g!==gen) return;
      const k = 1 + ((Math.random()*2.4)|0);
      for(let j=0;j<k;j++) setTimeout(()=>{ if(g===gen) startTwig(sproutOn(seg)); }, RM?0:j*130); };
    last = Math.max(last, start + seg.dur);
    start += seg.dur * 0.55;          // overlap, so a chain cascades outward
  }
  const to = it.node, d = Math.hypot(to.x-dot.x, to.y-dot.y);
  const flight = RM ? 1 : clamp(d*1.35, 400, 900);
  const hop = () => {
    dot.rT = R;
    travel(arc(dot.x, dot.y, to.x, to.y, Math.min(d*0.40, H*0.20), 40), flight,
      {prep: RM?0:110, end: () => {
        if(g!==gen) return;
        const sg = to.seg;
        if(sg) dot.rT = clamp(sg.w1/2*1.14, R*0.58, R*1.2);
        if(!fresh.length) return done();
        // if the branches are still arriving, wait for them before settling
        const left = last - performance.now();
        left > 0 ? setTimeout(()=>{ if(g===gen) done(); }, left) : done();
      }});
  };
  // aim to land as the last branch reaches the tip, so the leap reads as cause
  const lead = fresh.length ? (last - now) - flight - (RM?0:110) : 0;
  lead > 0 ? setTimeout(()=>{ if(g===gen) hop(); }, lead) : hop();
}

/* Back to the top. The sequence only ran forwards, so once the tree was up
   there was no way out of it short of reloading. Clears what was grown — the
   next visit grows a different tree anyway, and keeping a half-explored one
   around would make the restart feel broken rather than clean. */
function restart(){
  if(phase !== 'menu') return;
  gen++; anim=null;                              // abandon whatever was in flight
  busy=true; idle=false;
  // The dot pops off wherever it is and flies home while everything it grew
  // dissolves behind it, so the visitor arrives at the opening state rather
  // than being cut to it. Nothing is torn down until the dot has landed.
  hintEl.classList.remove('vis');
  document.getElementById('tr').classList.remove('vis','on');
  closeCal(); closeSheet();
  ITEMS.forEach(it=>{ if(it.el) it.el.classList.remove('show','pick'); });
  dot.colT = GPS_RGB.slice();                    // home is the pin again
  const t0=performance.now(), dim=RM?1:620;
  (function melt(){ fade = 1 - clamp((performance.now()-t0)/dim, 0, 1);
    if(fade > 0) requestAnimationFrame(melt); })();
  dot.rT = R;
  const d = Math.hypot(cx-dot.x, cy-dot.y);
  travel(arc(dot.x, dot.y, cx, cy, Math.min(d*0.34, H*0.18), 44), RM?1:780,
    {prep: RM?0:130, end:()=>{
      TREE=null; twigs=[]; roots=[]; rootsGrown=false; atNode=null; picked=null;
      sctx.clearRect(0,0,W,H);                   // the baked layer
      menuEl.innerHTML=''; ITEMS.forEach(it=>{ it.el=null; it.node=null; });
      aboutEl.className=''; aboutEl.style.opacity=0; aboutEl.innerHTML='';
      logo.vis=false; logo.prog=0; logo.ink=1;
      logo.scale=markW; logo.ox=cx; logo.oy=cy;
      dot.x=cx; dot.y=cy; dot.ring=0; dot.ringT=0; dot.r=R; dot.rT=R;
      dot.col=GPS_RGB.slice(); dot.colT=GPS_RGB.slice(); dot.gps=0; dot.gpsT=1;
      flood.r=0; document.body.classList.remove('flood');
      fade=1;                                    // nothing left to show
      phase='start'; setHint();
      busy=false; idle=true; nextIdle=performance.now()+700;
    }});
}

/* ═══════════ input ═══════════ */
// Six words do not fit four directions, so nothing is hardcoded: a swipe is
// matched to whichever tip sits closest to its angle. Angles are measured from
// the centre of the tip cluster, not the tree base — every tip is above the
// base, so base-relative angles would put all six in the top half. Measured
// this way the original four keep their cardinal swipes and the two new ones
// answer the diagonals.
function pickByAngle(dx, dy){
  const ns = ITEMS.map(it => TREE && TREE.tips[it.key]).filter(Boolean);
  if(ns.length !== ITEMS.length) return null;
  const c = {x: ns.reduce((s,n)=>s+n.x,0)/ns.length, y: ns.reduce((s,n)=>s+n.y,0)/ns.length};
  const a = Math.atan2(dy, dx);
  let best=null, bd=Infinity;
  ITEMS.forEach((it,i)=>{
    const t = Math.atan2(ns[i].y-c.y, ns[i].x-c.x);
    const d = Math.abs(((t-a+Math.PI*3) % TAU) - Math.PI);
    if(d < bd){ bd=d; best=it; }
  });
  return best;
}
function advance(v){
  if(busy) return;
  if(phase==='start') return goLogo();
  if(phase==='logoDone') return goAbout();
  if(phase==='aboutDone') return goMenu();
  if(phase==='menu' && v){ const it=pickByAngle(v.x, v.y); if(it) go(it); }
}
let sx0=0,sy0=0,st=0;
addEventListener('pointerdown',e=>{
  if(calEl.classList.contains('open')){ closeCal(); return; }
  if(sheet.classList.contains('open')){ closeSheet(); return; }
  sx0=e.clientX; sy0=e.clientY; st=performance.now();
});
addEventListener('pointerup',e=>{
  if(!st) return; const dx=e.clientX-sx0, dy=e.clientY-sy0, d=Math.hypot(dx,dy); st=0;
  advance(d>34 ? {x:dx, y:dy} : null);
});
let wqx=0, wqy=0;
addEventListener('wheel',e=>{
  wqx += e.deltaX; wqy += e.deltaY;
  if(Math.hypot(wqx,wqy) > 90){
    const v = {x:wqx, y:wqy}; wqx=wqy=0;
    advance(phase==='menu' ? v : null);
  }
},{passive:true});
addEventListener('keydown',e=>{
  // arrows are just unit vectors now; the angle match does the rest
  const k={ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1}}[e.key];
  if(k||e.key===' '||e.key==='Enter'){ e.preventDefault(); advance(k||null); }
});
const idxBtn=document.getElementById('idx'), sheet=document.getElementById('sheet');
if(!INDEX_ON) idxBtn.style.display='none';
topBtn.addEventListener('pointerdown',e=>{ e.stopPropagation(); restart(); });
function closeSheet(){ sheet.classList.remove('open'); idxBtn.setAttribute('aria-expanded','false'); }
idxBtn.addEventListener('pointerdown',e=>{ e.stopPropagation();
  const o=!sheet.classList.contains('open');
  sheet.classList.toggle('open',o); idxBtn.setAttribute('aria-expanded',o); });
sheet.addEventListener('pointerdown',e=>e.stopPropagation());
calEl.addEventListener('pointerdown',e=>e.stopPropagation());
document.querySelectorAll('.lang button').forEach(b=>{
  b.addEventListener('pointerdown',e=>{ e.stopPropagation(); lang=b.id;
    document.querySelectorAll('.lang button').forEach(x=>x.classList.toggle('act',x===b));
    paintText(); });
});

/* ═══════════ frame ═══════════ */
function frame(now){
  ctx.clearRect(0,0,W,H);
  ctx.globalAlpha = fade;            // restart() dissolves the drawing, not the dot
  ctx.drawImage(stat, 0, 0, W, H);

  for(const r of roots){
    if(r.baked || now < r.t0) continue;
    r.prog = clamp((now-r.t0)/r.dur, 0, 1);
    inkStroke(r, r.w0, r.w1, BARK, eOut(r.prog));
    if(r.prog >= 1) bakeStroke(r, r.w0, r.w1, BARK);
  }
  if(TREE){
    for(const s of TREE.segs){
      if(s.baked) continue;
      if(s.t0){                      // painting itself, on its own clock
        const r = clamp((now-s.t0)/s.dur, 0, 1);
        s.prog = eOut(r);
        if(r >= 1 && !s.drawn){ s.drawn=true; s.t0=0;
          if(s.onDone){ const f=s.onDone; s.onDone=null; f(); } }
      }
      if(s.prog<=0) continue;
      inkStroke(s, s.w0, s.w1, INK, s.prog);
      if(s.prog >= 1 && s.drawn) bakeStroke(s, s.w0, s.w1, INK);
    }
    for(const t of twigs){
      if(t.baked || !t.t0) continue;
      t.prog = clamp((now-t.t0)/t.dur,0,1);
      inkStroke(t, t.w0, t.w1, INK, eOut(t.prog));
      if(t.prog >= 1) bakeStroke(t, t.w0, t.w1, INK);
    }
  }

  if(logo.vis) drawLogo();
  ctx.globalAlpha = 1;
  if(flood.r > 0.5){                   // the dot, opened out into the page
    ctx.beginPath(); ctx.arc(flood.x, flood.y, flood.r, 0, TAU);
    ctx.fillStyle = INK; ctx.fill();
  }
  dot.px=dot.x; dot.py=dot.y;
  if(anim){
    const el=now-anim.t0;
    if(el<anim.prep){ dot.s=0.34*(el/anim.prep); dot.ang=0; }
    else{
      const p=clamp((el-anim.prep)/anim.dur,0,1), e=anim.ease(p);
      const f=e*(anim.path.length-1), i=Math.floor(f), fr=f-i;
      const a=anim.path[i], b=anim.path[Math.min(i+1,anim.path.length-1)];
      dot.x=a.x+(b.x-a.x)*fr; dot.y=a.y+(b.y-a.y)*fr;
      if(anim.logo) logo.prog=e;
      const vx=dot.x-dot.px, vy=dot.y-dot.py, sp=Math.hypot(vx,vy);
      if(sp>0.35){ dot.ang=Math.atan2(vy,vx); dot.s=clamp(sp*0.016,0,0.5); }
      if(p>=1){ const end=anim.end; anim=null; dot.ang=0; dot.s=0.40; dot.sv=0; if(end) end(); }
    }
  }else{
    dot.sv += (-dot.s*0.26 - dot.sv*0.24); dot.s += dot.sv;
    if(idle && !busy && now>nextIdle) hopIdle();
  }

  if(dot.vis<1) dot.vis=clamp(dot.vis+0.035,0,1);
  dot.ring += (dot.ringT-dot.ring)*0.07;
  dot.r += (dot.rT-dot.r)*0.10;
  for(let i=0;i<3;i++) dot.col[i] += (dot.colT[i]-dot.col[i])*dot.colK;
  dot.gps += (dot.gpsT-dot.gps)*0.10;
  // Once the stroke is under way the nib sinks into its own ink and the line
  // draws itself, then surfaces again before it reaches the far tip. Driven off
  // logo.prog rather than timers, so it cannot drift out of step with the paint.
  dot.subT = (logo.vis && logo.prog > 0.03 && logo.prog < 0.82) ? 0 : 1;
  // surfaces briskly: while it is part-transparent the nib overhangs the stroke
  // onto bare paper and reads as a pale smudge, so that phase should be short
  dot.sub += (dot.subT-dot.sub)*0.24;
  // once the flood is bigger than the dot, the dot IS the flood — drawing it
  // again would only show its paper collar against the yellow
  if(flood.r > dot.r*1.6){ requestAnimationFrame(frame); return; }
  if(dot.sub < 0.012){ requestAnimationFrame(frame); return; }   // under the ink
  ctx.globalAlpha = dot.sub;
  const s=clamp(dot.s,-0.6,0.9);
  const rr=dot.r*(dot.vis<1?Math.max(0,eBack(dot.vis)):1);
  const rx=rr*(1+s*0.55), ry=rr/(1+s*0.55);
  if(dot.gps > 0.02){
    // A map pin's accuracy ring: it pulses out and fades, which is what reads
    // as GPS at a glance. Only alive before the first tap.
    const t = RM ? 0.5 : ((now % 2200)/2200);
    const hr = dot.r*(2.2 + 2.2*t);
    ctx.beginPath(); ctx.arc(dot.x, dot.y, hr, 0, TAU);
    ctx.fillStyle = `rgba(${GPS_RGB[0]},${GPS_RGB[1]},${GPS_RGB[2]},${(0.20*(1-t)*dot.gps).toFixed(3)})`;
    ctx.fill();
  }
  ctx.save(); ctx.translate(dot.x,dot.y); ctx.rotate(dot.ang);
  if(dot.ring>0.01){ const g=4.2*dot.ring;
    ctx.beginPath(); ctx.ellipse(0,0,rx+g,ry+g,0,0,TAU);
    // compose with the dive, not reset past it
    ctx.globalAlpha=dot.ring*dot.sub; ctx.fillStyle='#fff'; ctx.fill();
    ctx.globalAlpha=dot.sub; }
  ctx.beginPath(); ctx.ellipse(0,0,rx,ry,0,0,TAU);
  ctx.fillStyle=dotFill(); ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;

  requestAnimationFrame(frame);
}

function rescaleTree(kx,ky,kw){
  if(!TREE) return;
  const mv = a => a.forEach(q => { q.x*=kx; q.y*=ky; });
  [TREE.base, ...TREE.segs.map(s=>s.b)].forEach(n => { n.x*=kx; n.y*=ky; });
  TREE.segs.forEach(s => { mv(s.pts); s.w0*=kw; s.w1*=kw; s.p2d=null; s.baked=false;
    s.len=Math.hypot(s.b.x-s.a.x, s.b.y-s.a.y); });
  twigs.forEach(t => { mv(t.pts); t.w0*=kw; t.w1*=kw; t.p2d=null; t.baked=false; });
}
function rescaleRoots(kx,ky,kw){
  roots.forEach(r => { r.pts.forEach(q=>{ q.x*=kx; q.y*=ky; });
    r.w0*=kw; r.w1*=kw; r.p2d=null; r.baked=false; });
}
let lastW=0, lastH=0;
let rt; addEventListener('resize',()=>{
  // iOS collapses the address bar and fires resize with a height-only delta.
  // Relaying out there would regenerate the tree mid-session.
  if(TOUCH && innerWidth===lastW && Math.abs(innerHeight-lastH) < 130) return;
  clearTimeout(rt); rt=setTimeout(()=>{
  const post = phase!=='start', oW=W, oH=H, oSW=SW;
  layout();
  rescaleTree(W/oW, H/oH, SW/oSW); rescaleRoots(W/oW, H/oH, SW/oSW);
  if(post && logo.vis){ const f=footerPose(); logo.scale=f.scale; logo.ox=f.ox; logo.oy=f.oy; }
  if(flood.r > 0) flood.r = coverR(flood.x, flood.y);   // keep the page covered
  if(phase==='menu') placeMenu();
  dot.x=clamp(dot.x,R+8,W-R-8); dot.y=clamp(dot.y,R+8,H-R-8);
},200); });
lastW=innerWidth; lastH=innerHeight;

layout(); dot.r=R; dot.rT=R; paintText(); setHint();
idle=true; nextIdle=performance.now()+900;
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
